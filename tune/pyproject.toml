[project]
name = "talkme-tune"
version = "0.1.0"
description = "Data generation, call timing, evaluation and LoRA training for talkme micro-turn adapters"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "transformers>=4.57",
    "safetensors>=0.4",
    "peft>=0.13",
    "accelerate>=1.0",
    "sentencepiece",
    "gguf",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
