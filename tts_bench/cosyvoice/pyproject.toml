[project]
name = "bench-cosyvoice"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["conformer==0.3.2", "diffusers==0.29.0", "hydra-core==1.3.2", "HyperPyYAML==1.2.3", "librosa==0.10.2", "lightning==2.2.4", "omegaconf==2.3.0", "onnx==1.16.0", "onnxruntime==1.18.0", "openai-whisper==20231117", "protobuf==4.25", "rich==13.7.1", "transformers==4.51.3", "x-transformers==2.11.24", "wetext==0.0.4", "numpy==1.26.4", "matplotlib==3.7.5", "modelscope==1.20.0", "pyarrow==18.1.0", "torch==2.6.0", "torchaudio==2.6.0", "soundfile", "setuptools<81", "gdown==5.1.0", "wget==3.2", "pyworld==0.3.4", "inflect==7.3.1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[tool.uv.extra-build-dependencies]
openai-whisper = ["setuptools<81", "gdown==5.1.0", "wget==3.2", "pyworld==0.3.4", "inflect==7.3.1"]
