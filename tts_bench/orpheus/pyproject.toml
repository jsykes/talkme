[project]
name = "bench-orpheus"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["snac==1.2.1", "requests", "torch==2.6.0", "torchaudio==2.6.0", "soundfile"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
